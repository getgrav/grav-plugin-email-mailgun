name: Email Mailgun
slug: email-mailgun
type: plugin
version: 1.1.0
description: Mailgun integration for new Email plugin
icon: envelope
author:
  name: Team Grav
  email: devs@getgrav.org
homepage: https://github.com/getgrav/grav-plugin-email-mailgun
keywords: grav, plugin, etc
bugs: https://github.com/getgrav/grav-plugin-email-mailgun/issues
docs: https://github.com/getgrav/grav-plugin-email-mailgun/blob/develop/README.md
license: MIT

compatibility:
  grav: ['1.7', '2.0']

dependencies:
  - { name: grav, version: '>=1.7.0' }
  - { name: email, version: '>=4.0.0' }

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    transport:
      type: select
      size: small
      label: Transport
      default: api
      options:
        api: API (faster)
        https: HTTPS
        smtp: SMTP


    api_key:
      type: text
      label: API Key (for API Only)

    domain:
      type: text
      label: Domain (for API Only)

    region:
      type: select
      size: small
      label: Region (for API/SMTP)
      default: us
      help: Select eu if your Mailgun domain is hosted in the EU region.
      options:
        us: US
        eu: EU

    username:
      type: text
      label: Username (for SMTP Only)

    password:
      type: text
      label: Password (for SMTP Only)

    signing_key:
      type: password
      label: Webhook Signing Key
      help: "Only needed if something on this site reads Mailgun's delivery reports. It is a different string from the API key above: find it in Mailgun under your profile menu, on the API Security page, as the HTTP webhook signing key. Every webhook Mailgun posts is signed with it, and without it the events cannot be told apart from anybody else's. Leave it empty and it will be filled in for you the first time a webhook is set up from here with an account key."
